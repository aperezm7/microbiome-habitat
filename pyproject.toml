[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "microbiome-habitat"
version = "0.1.0"
description = "Predict EMPO habitat from a phylum-level Earth Microbiome Project 16S profile"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pandas>=2.2",
  "pyarrow>=17",
  "scikit-learn>=1.5",
  "numpy>=2.0",
  "scipy>=1.14",
  "biopython>=1.84",
  "biom-format>=2.1.16",
  "httpx>=0.27",
  "joblib>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.setuptools.package-dir]
"" = "."
habitat = "src/habitat"

[tool.setuptools]
packages = [
  "habitat",
  "services",
  "services.data",
  "services.features",
  "services.model",
  "services.gateway",
  "challenges",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests", "challenges"]
addopts = "--import-mode=importlib"
